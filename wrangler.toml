name = "edgar-fetch"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The web page (public/) is served as static assets; anything not found there
# (i.e. /api/...) goes to src/worker.js
[assets]
directory = "./public"
not_found_handling = "none"

# Permanent transcript library (optional). Create a KV namespace in the Cloudflare dashboard
# (Storage & databases → Workers KV → Create, name it "edgar-fetch-transcripts"), copy its ID,
# then uncomment the three lines below and paste the ID. Without it, transcripts still work
# but are only cached for a while.
# [[kv_namespaces]]
# binding = "TRANSCRIPTS_KV"
# id = "PASTE_NAMESPACE_ID_HERE"
